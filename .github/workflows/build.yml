name: Build & Release

on:
  workflow_dispatch: # manual runs are the normal path — trigger a build on demand
    inputs:
      version:
        description: >-
          Test version to stamp, e.g. 0.1.99 — a real semver BELOW the release
          under test so the update check offers that release. Blank = the
          0.0.0-<sha> fallback, which is the "never compare, never prompt"
          sentinel and so can never show an update.
        required: false
        default: ""
  # No build on every push to main: commits accumulate and are built when
  # wanted via the manual run above (each run still attaches the per-OS bundle
  # + Windows installer). A v* tag push additionally cuts a GitHub Release
  # (see the tag-gated "Attach to release" step below).
  push:
    tags:
      - "v*"

permissions:
  contents: write # create releases + upload assets on tags

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux build disabled — the maintainer runtime-tests Linux locally
          # (Arch PKGBUILD built from main via makepkg), so CI Linux minutes add
          # no signal. Re-enable by uncommenting:
          # - os: ubuntu-latest
          #   target: linux-amd64
          #   archive: tar.gz
          # macOS build disabled for now — no Mac available to runtime-test the
          # bundle, and per ROADMAP M0 macOS is source-build only (unsigned
          # bundles get Gatekeeper-quarantined). Re-enable by uncommenting:
          # - os: macos-latest
          #   target: darwin-arm64
          #   archive: tar.gz
          - os: windows-latest
            target: windows-amd64
            archive: zip

    # Third-party actions are pinned by commit SHA (the tag in the comment is
    # informational). A movable tag is exactly the supply-chain class this
    # project's update trust model is built against — a repointed action tag
    # would poison the installer AND the manifest draft the release procedure
    # signs a hash of.
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history: the release-notes step walks back to the previous
          # stable tag (a depth-0 fetch also brings all tags).
          fetch-depth: 0

      # Runs BEFORE every build step so the version can be stamped into the
      # Go daemon (-X main.version), the Flutter client (--dart-define) and
      # the installer. `numeric` is the digits-only X.Y.Z for the places that
      # cannot hold a prerelease suffix (Windows VERSIONINFO, flutter
      # --build-name): the tag version with any -suffix stripped, or 0.0.0
      # for the sha fallback. 0.0.0 is a sentinel the daemon's update check
      # treats as "unstamped, never compare" (internal/update), so a
      # dispatch build is never offered the latest release as a downgrade.
      - name: Compute version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            # A dispatch-stamped test build: a real version so the update check
            # actually compares. Tolerate a leading v — CI re-adds it below.
            version="${INPUT_VERSION#v}"
          else
            version="0.0.0-$(git rev-parse --short HEAD)"
          fi
          numeric="${version%%-*}"
          if [[ ! "$numeric" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            numeric="0.0.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"

      # Release gate: a v-tag build compiles the update trust root out of
      # keys.go, and the dev placeholder keys (their secret halves are not
      # held offline) must never ship in a release. sign-update.sh cannot
      # catch this — it verifies against whatever keys are compiled in — so
      # the tag build refuses while the placeholder marker is present.
      - name: Refuse dev update keys (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if grep -q "DEV PLACEHOLDERS" daemon-go/internal/update/keys.go; then
            echo "keys.go still carries the DEV PLACEHOLDER update keys." >&2
            echo "Replace them with the production public keys and re-sign" >&2
            echo "daemon-go/internal/update/testdata (command in keys.go) before tagging." >&2
            exit 1
          fi

      - name: Install Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: daemon-go/go.mod
          cache-dependency-path: daemon-go/go.sum

      - name: Install Flutter
        if: runner.os != 'macOS'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Python (for packaging scripts)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Build Go daemon (embeds sing-box + xray)
        shell: bash
        run: |
          cd daemon-go
          TAGS="with_gvisor,with_utls,with_clash_api,with_quic"
          go vet -tags "$TAGS" ./...
          go test -tags "$TAGS" ./...
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=v${{ steps.ver.outputs.version }}" \
            -tags "$TAGS" \
            -o bin/iron-link-daemon${{ runner.os == 'Windows' && '.exe' || '' }} \
            ./cmd/iron-link-daemon

      # Ordering is a contract: the live smoke spawns the freshly built
      # daemon-go/bin/iron-link-daemon[.exe]. On Windows this is the
      # end-to-end proof of the named-pipe transport against the real
      # daemon (and its real SDDL).
      - name: Flutter analyze + test
        if: runner.os != 'macOS'
        shell: bash
        working-directory: client-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # The Flutter desktop app only builds on its own OS — this is the
      # only way to get a Windows GUI binary without a Windows dev box.
      # Uploaded as its own artifact; bundle/installer integration is the
      # M0 packaging task.
      # --build-number fills the fourth VERSIONINFO numeric of the exe
      # (passing --build-name alone zeroes it); the workflow run number keeps
      # it monotonic so every CI build stays distinguishable. Version identity
      # itself travels in the dart-define.
      - name: Build Flutter app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: client-flutter
        run: >
          flutter build windows --release
          --build-name=${{ steps.ver.outputs.numeric }}
          --build-number=${{ github.run_number }}
          --dart-define=IRON_LINK_VERSION=v${{ steps.ver.outputs.version }}

      - name: Upload Flutter app (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: iron-link-flutter-windows-amd64
          path: client-flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30

      # Single-file installer for the Flutter client + the elevated daemon.
      # Runs only on Windows, after both halves are built. The .iss explains
      # the no-service / RUNASADMIN design.
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # App-local–deploy the MSVC runtime so the Flutter exe launches on a
          # machine without the VC++ redist (flutter build does not bundle it).
          $rel = "client-flutter\build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $src) { Copy-Item $src $rel -Force }
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
            else { choco install innosetup -y --no-progress }
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "/DVersionInfoVersion=${{ steps.ver.outputs.numeric }}.0" `
            "/DDaemonExe=${{ github.workspace }}\daemon-go\bin\iron-link-daemon.exe" `
            "/DFlutterDir=${{ github.workspace }}\client-flutter\build\windows\x64\runner\Release" `
            "/DOutputDir=${{ github.workspace }}\dist" `
            "/DOutputBase=iron-link-${{ steps.ver.outputs.version }}-windows-amd64-setup" `
            packaging\windows\iron-link.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: iron-link-windows-installer
          path: dist/iron-link-*-setup.exe
          if-no-files-found: error
          retention-days: 30

      # Release path only: emit a DRAFT update manifest next to the installer.
      # CI fills the artifact facts (name/size/sha256/URL), timestamps, and a
      # seq HINT read from the published manifest (+1) — the authoritative seq
      # counter lives next to the offline signing key, and sign-update.sh
      # refuses a mismatch, so a stale CDN read here cannot ship. The owner
      # reviews the draft, signs it offline with scripts/sign-update.sh and
      # commits update.json + update.json.minisig to updates/ on main. CI
      # never signs.
      - name: Draft update manifest (tags only)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - "dist/iron-link-${{ steps.ver.outputs.version }}-windows-amd64-setup.exe" "v${{ steps.ver.outputs.version }}" "${{ github.server_url }}/${{ github.repository }}" "${{ github.repository }}" <<'EOF'
          import hashlib, json, os, sys, urllib.request
          from datetime import datetime, timedelta, timezone
          path, version, repo, slug = sys.argv[1:5]
          name = os.path.basename(path)
          with open(path, "rb") as f:
              sha256 = hashlib.sha256(f.read()).hexdigest()
          seq = 0  # the sign-update.sh placeholder, kept when no manifest is reachable
          for url in (
              f"https://raw.githubusercontent.com/{slug}/main/updates/update.json",
              f"https://raw.githubusercontent.com/{slug}/updates/update.json",  # legacy branch
          ):
              try:
                  with urllib.request.urlopen(url, timeout=10) as r:
                      seq = json.load(r)["seq"] + 1
                  break
              except Exception:
                  pass
          now = datetime.now(timezone.utc).replace(microsecond=0)
          stamp = lambda d: d.strftime("%Y-%m-%dT%H:%M:%SZ")
          manifest = {
              "schema": 1,
              "seq": seq,
              "channel": "stable",
              "version": version,
              "published_at": stamp(now),
              "expires_at": stamp(now + timedelta(days=180)),
              "notes_url": f"{repo}/releases/tag/{version}",
              "artifacts": [
                  {
                      "os": "windows", "arch": "amd64", "kind": "installer",
                      "name": name, "size": os.path.getsize(path), "sha256": sha256,
                      "urls": [f"{repo}/releases/download/{version}/{name}"],
                  },
                  {"os": "linux", "arch": "amd64", "kind": "none",
                   "name": "", "size": 0, "sha256": "", "urls": []},
                  {"os": "darwin", "arch": "arm64", "kind": "none",
                   "name": "", "size": 0, "sha256": "", "urls": []},
              ],
          }
          with open("dist/update.json.draft", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          with open("dist/update.json.draft") as f:
              print(f.read())
          EOF

      - name: Assemble bundle
        run: >
          python packaging/assemble.py
          --target ${{ matrix.target }}
          --version ${{ steps.ver.outputs.version }}
          --daemon-bin daemon-go/bin/iron-link-daemon${{ runner.os == 'Windows' && '.exe' || '' }}
          --staging dist
          --archive ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: iron-link-${{ matrix.target }}
          path: |
            dist/iron-link-*.tar.gz
            dist/iron-link-*.zip
            dist/iron-link-*.sha256
          if-no-files-found: error
          retention-days: 30

      # The release body: every commit subject since the previous STABLE tag
      # (pre-release tags are skipped, so a stable release lists everything
      # since the last stable one). First release ever = the whole history.
      - name: Release notes (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          prev=$(git describe --tags --abbrev=0 --exclude='*-*' "${tag}^" 2>/dev/null || true)
          {
            if [[ -n "$prev" ]]; then
              git log --pretty='- %s' "$prev..$tag"
              echo
              echo "**Full changelog:** ${{ github.server_url }}/${{ github.repository }}/compare/$prev...$tag"
            else
              git log --pretty='- %s' "$tag"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # A tag with a pre-release identifier (e.g. v0.1.0-alpha.1) → marked
          # as a GitHub pre-release, not "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            dist/iron-link-*.tar.gz
            dist/iron-link-*.zip
            dist/iron-link-*.sha256
            dist/iron-link-*-setup.exe
            dist/update.json.draft
